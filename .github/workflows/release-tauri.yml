name: Build & Release LumSMP Launcher v2 (Rust + Tauri)

on:
  push:
    branches: [main, master]
    tags: ["v2*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build LumSMP Launcher (NSIS)
        working-directory: src-tauri
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          $ErrorActionPreference = 'Continue'
          cargo tauri build --bundles nsis *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content "$env:RUNNER_TEMP/build.log" | Where-Object { $_ -match '^(error|warning: unused)|^\s*-->|^\s*\d+ \||^\s*= (note|help)' } | Select-Object -First 60
            $msg = ($lines -join '%0A')
            Write-Host "::error title=Build hatasi::$msg"
            exit 1
          }

      - name: Prepare release artifacts (Setup EXE + SHA-256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-tauri | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer (.exe) bulunamadi" }
          Copy-Item $exe.FullName "dist-tauri/LumSMP-Launcher-Setup.exe" -Force
          $hash = (Get-FileHash "dist-tauri/LumSMP-Launcher-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  LumSMP-Launcher-Setup.exe" | Out-File -Encoding ascii -NoNewline "dist-tauri/sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: lumsmp-launcher-windows
          path: dist-tauri/*
          retention-days: 30

      - name: Publish GitHub Release (on v2* tag)
        if: startsWith(github.ref, 'refs/tags/v2')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-tauri/LumSMP-Launcher-Setup.exe \
            dist-tauri/sha256.txt \
            --title "LumSMP Launcher $GITHUB_REF_NAME" \
            --notes "LumSMP Launcher $GITHUB_REF_NAME (Rust + Tauri v2, OneClient mimarisi, otomatik güncelleme destekli)" \
            --verify-tag
